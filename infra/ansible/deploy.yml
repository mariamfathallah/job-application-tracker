# Déploie une version de l'application dans un environnement provisionné par OpenTofu.
# Variables attendues (fournies par ci/scripts/deploy.sh à partir des outputs OpenTofu) :
#   env_name, app_version, app_name, app_port, network_name, db_host, db_password, jwt_secret
# Variables d'environnement : NEXUS_URL, NEXUS_USER, NEXUS_PASSWORD
- name: Déployer job-application-tracker
  hosts: docker_host
  gather_facts: false

  vars:
    nexus_url: "{{ lookup('env', 'NEXUS_URL') | default('http://nexus:8081', true) }}"
    artifact_url: "{{ nexus_url }}/repository/artifacts/job-application-tracker/{{ app_version }}/job-application-tracker-{{ app_version }}.jar"
    build_dir: "/tmp/build-{{ app_name }}"
    image: "{{ app_name }}"
    health_url: "http://host.docker.internal:{{ app_port }}/actuator/health"

  tasks:
    - name: Préparer le dossier de construction de l'image
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        mode: "0755"

    - name: Télécharger l'artefact depuis Nexus (le même que celui testé)
      ansible.builtin.get_url:
        url: "{{ artifact_url }}"
        dest: "{{ build_dir }}/app.jar"
        url_username: "{{ lookup('env', 'NEXUS_USER') }}"
        url_password: "{{ lookup('env', 'NEXUS_PASSWORD') }}"
        force_basic_auth: true
        mode: "0644"
      no_log: true

    - name: Écrire le Dockerfile d'exécution
      ansible.builtin.copy:
        dest: "{{ build_dir }}/Dockerfile"
        mode: "0644"
        content: |
          FROM eclipse-temurin:21-jre
          COPY app.jar /app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "/app.jar"]

    - name: Construire l'image {{ image }}:{{ app_version }}
      community.docker.docker_image:
        name: "{{ image }}"
        tag: "{{ app_version }}"
        source: build
        build:
          path: "{{ build_dir }}"
        force_source: false

    - name: Démarrer (ou mettre à jour) le conteneur de l'application
      block:
        - name: Conteneur {{ app_name }}
          community.docker.docker_container:
            name: "{{ app_name }}"
            image: "{{ image }}:{{ app_version }}"
            state: started
            restart_policy: unless-stopped
            network_mode: "{{ network_name }}"
            networks:
              - name: "{{ network_name }}"
            published_ports:
              - "{{ app_port }}:8080"
            labels:
              project: job-application-tracker
              environment: "{{ env_name }}"
              version: "{{ app_version }}"
              managed-by: ansible
            env:
              SPRING_PROFILES_ACTIVE: prod
              SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ db_host }}:5432/jobtracker"
              SPRING_DATASOURCE_USERNAME: jobtracker
              SPRING_DATASOURCE_PASSWORD: "{{ db_password }}"
              JWT_SECRET: "{{ jwt_secret }}"
          no_log: true

        - name: Vérifier la santé de l'application
          ansible.builtin.uri:
            url: "{{ health_url }}"
            status_code: 200
          register: health
          until: health.status == 200
          retries: 40
          delay: 3

      rescue:
        - name: Récupérer les logs du conteneur
          ansible.builtin.command: docker logs --tail 40 {{ app_name }}
          register: logs
          changed_when: false
          failed_when: false

        - name: Échec du déploiement
          ansible.builtin.fail:
            msg: "Healthcheck KO sur {{ env_name }} ({{ app_version }})\n{{ logs.stdout | default('') }}\n{{ logs.stderr | default('') }}"

    - name: Résumé
      ansible.builtin.debug:
        msg: "{{ env_name }} OK ({{ app_version }}) sur le port {{ app_port }}"
